name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --python 3.13

      - name: Build executable
        run: uv run pyinstaller --noconfirm zorma.spec

      - name: Zip artifact
        run: Compress-Archive -Path dist/zorma/* -DestinationPath zorma-${{ github.ref_name }}-windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: zorma-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
