[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zorma"
version = "0.1.0"
description = "Clasificador automático de archivos"
authors = [{ name = "Zorma Team" }]
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
zorma = "zorma.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zorma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "zorma.ui.shared.toast"
ignore_errors = true
